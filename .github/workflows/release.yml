name: Release

# Opens the "Version Packages" pull request, and publishes
# @phantom/react-native-webview to npm once that pull request merges.
#
# Publishing uses npm Trusted Publishing (keyless OIDC), so there is no npm
# token. Security registers the trusted publisher against this repository and
# this workflow file name, so do not rename this file. Changesets shells out to
# npm for the publish, and only npm >= 11.5.1 can make the OIDC exchange.
#
# Use the manual trigger to retry a publish that failed for an already merged
# version.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}
  # TEMPORARY, REMOVE BEFORE MERGE. It runs the trusted-publishing probe jobs
  # below on the pull request. The publish job never runs for this event.
  pull_request: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      # Node 20 ships npm 10.x, which has no Trusted Publishing support. Same
      # version phantom/libs pins.
      - name: Install the npm version that supports Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Install Dependencies
        run: yarn

      # No NPM_TOKEN: npm exchanges the GitHub OIDC token through the trusted
      # publisher.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba
        with:
          publish: yarn release
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm's OIDC exchange fails silently by design: lib/utils/oidc.js logs
          # at verbose and returns undefined, then the publish continues
          # unauthenticated and reports only E404 on PUT. Verbose logging turns a
          # future failure into a readable cause.
          NPM_CONFIG_LOGLEVEL: verbose

  # TEMPORARY, REMOVE BEFORE MERGE.
  #
  # Runs the release job's own setup, then a dry-run publish. `npm publish`
  # performs the OIDC exchange before it checks the dry-run flag (npm 11.5.1,
  # lib/commands/publish.js line 141), so this proves the exchange works from
  # this workflow file, with this npm version, in this installed workspace, and
  # it uploads nothing.
  probe-publish-auth:
    name: Probe publish auth (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Install the npm version that supports Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Install Dependencies
        run: yarn

      - name: Dry-run publish and report the OIDC outcome
        run: |
          echo "npm $(npm --version) at $(command -v npm)"
          npm publish --dry-run --loglevel verbose > publish.log 2>&1 || true
          grep -iE "oidc|provenance|E404|Unauthorized|token" publish.log || true
          echo "--- verdict ---"
          if grep -q "Successfully retrieved and set token" publish.log; then
            echo "OIDC exchange succeeded. The real publish will authenticate."
          else
            echo "OIDC exchange did NOT succeed. Do not merge yet."
            exit 1
          fi
